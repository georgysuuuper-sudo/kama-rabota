name: Обновление вакансий и деплой

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: kama-rabota
  cancel-in-progress: false

jobs:
  collect:
    name: Сбор и фильтрация hh.ru
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Зависимости
        run: pip install --quiet requests

      - name: Сбор вакансий
        # Если hh.ru недоступен с раннера, не роняем деплой: публикуем уже
        # закоммиченные проверенные данные (selftest ниже их валидирует).
        continue-on-error: true
        env:
          HH_TOKEN: ${{ secrets.HH_TOKEN }}
        run: python scraper/fetch_hh.py --source auto --pages 20 --limit-details 420

      - name: Проверка выдачи
        run: python scraper/selftest.py

      - name: Коммит данных
        id: commit
        run: |
          git config user.name "kama-rabota-bot"
          git config user.email "actions@github.com"
          git add data/vacancies.json data/meta.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Данные не изменились"
          else
            git commit -m "Данные hh.ru: обновление $(date -u +'%Y-%m-%d %H:%M') UTC [skip ci]"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Настройка Pages
        uses: actions/configure-pages@v5

      - name: Артефакт сайта
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    name: Публикация на GitHub Pages
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Деплой
        id: deployment
        uses: actions/deploy-pages@v4